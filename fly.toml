# fly.toml app configuration file generated for chatroom-brentonoliver on 2026-09-21T03:06:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chatroom-brentonoliver'
primary_region = 'syd'
kill_signal = 'SIGTERM'
kill_timeout = '15s'

[build]

[deploy]
  strategy = 'immediate'

[env]
  DATABASE_PATH = '/data/chat.sqlite'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'chatroom_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
