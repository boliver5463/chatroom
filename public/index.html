<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatroom</title>
    <style>
      :root {
        color-scheme: dark;
        --surface-1: #1a1a19;
        --plane: #0d0d0d;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #898781;
        --hairline: rgba(255, 255, 255, 0.1);
        --rule: #2c2c2a;
        --accent: #3987e5;
        --good: #0ca30c;
        --critical: #d03b3b;
        --warning: #fab219;
        --radius: 10px;
        --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: var(--font);
        background: var(--plane);
        color: var(--text-primary);
        font-size: 14px;
        line-height: 1.5;
      }

      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid var(--hairline);
        background: #232321;
        color: var(--text-primary);
        padding: 8px 14px;
      }
      button:hover {
        background: #2c2c2a;
      }
      button.primary {
        background: var(--accent);
        border-color: transparent;
        color: #fff;
        font-weight: 600;
      }
      button.primary:hover {
        filter: brightness(1.1);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      input,
      select,
      textarea {
        font: inherit;
        background: #121211;
        color: var(--text-primary);
        border: 1px solid var(--rule);
        border-radius: 8px;
        padding: 9px 12px;
        width: 100%;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      /* ---------- Auth gate ---------- */
      #gate {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 24px;
      }
      .card {
        background: var(--surface-1);
        border: 1px solid var(--hairline);
        border-radius: 14px;
        padding: 28px;
        width: min(380px, 100%);
      }
      .card h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .card p.sub {
        margin: 0 0 20px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .field {
        margin-bottom: 12px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 5px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }

      /* ---------- App shell ---------- */
      #app {
        display: none;
        grid-template-columns: 240px 1fr;
        height: 100%;
      }
      #app.live {
        display: grid;
      }

      aside {
        background: var(--surface-1);
        border-right: 1px solid var(--hairline);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .aside-head {
        padding: 14px 16px;
        border-bottom: 1px solid var(--hairline);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .aside-head .me {
        font-weight: 600;
      }
      .aside-head .role {
        font-size: 11px;
        color: var(--text-muted);
      }
      .rooms {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        min-height: 0;
      }
      .room-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        padding: 8px 10px;
        border-radius: 8px;
        color: var(--text-secondary);
      }
      .room-item:hover {
        background: #232321;
      }
      .room-item.active {
        background: #232321;
        color: var(--text-primary);
        font-weight: 600;
      }
      .room-item .badge {
        font-size: 11px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .room-item .unread {
        background: var(--accent);
        color: #fff;
        border-radius: 999px;
        padding: 1px 7px;
        font-size: 11px;
        font-weight: 700;
      }
      .aside-foot {
        padding: 10px;
        border-top: 1px solid var(--hairline);
        display: grid;
        gap: 8px;
      }

      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      header.room-head {
        padding: 12px 20px;
        border-bottom: 1px solid var(--hairline);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      header.room-head h2 {
        margin: 0;
        font-size: 16px;
      }
      header.room-head .meta {
        font-size: 12px;
        color: var(--text-muted);
      }

      #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      /* Sits at the top of the scroller and reports what automatic paging is
         doing. Hidden when there is nothing to say, so it costs no height. */
      #history-status {
        display: none;
        flex: none;
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
        padding: 8px 0;
      }
      #history-status.show {
        display: block;
      }

      .msg {
        padding: 5px 10px;
        border-radius: 8px;
        position: relative;
      }
      .msg:hover {
        background: #16161500;
        background: rgba(255, 255, 255, 0.03);
      }
      .msg.mentions-me {
        background: rgba(57, 135, 229, 0.12);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .msg .who {
        font-weight: 600;
        margin-right: 8px;
      }
      .msg .at {
        font-size: 11px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .msg .tag {
        font-size: 11px;
        color: var(--text-muted);
        margin-left: 6px;
      }
      .msg .body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .msg.deleted .body {
        color: var(--text-muted);
        font-style: italic;
      }
      /* The wrapper carries the aspect ratio from the stored dimensions, so
         the log does not jump around as GIFs decode. */
      .msg .gif {
        display: block;
        margin-top: 4px;
        max-width: min(320px, 100%);
        border-radius: 10px;
        overflow: hidden;
        background: #121211;
        border: 1px solid var(--hairline);
      }
      .msg .gif img {
        display: block;
        width: 100%;
        height: auto;
      }
      .mention {
        background: rgba(57, 135, 229, 0.22);
        color: #cde2fb;
        border-radius: 4px;
        padding: 0 3px;
        font-weight: 600;
      }
      .msg .actions {
        position: absolute;
        right: 8px;
        top: 4px;
        display: none;
        gap: 4px;
      }
      .msg:hover .actions {
        display: flex;
      }
      .msg .actions button {
        padding: 2px 8px;
        font-size: 11px;
      }
      .day-rule {
        text-align: center;
        color: var(--text-muted);
        font-size: 11px;
        margin: 10px 0;
        border-top: 1px solid var(--rule);
        line-height: 0;
      }
      .day-rule span {
        background: var(--plane);
        padding: 0 10px;
      }

      .composer {
        border-top: 1px solid var(--hairline);
        padding: 12px 20px 16px;
        position: relative;
      }

      /* ---------- GIF picker ---------- */
      #gif-panel {
        display: none;
        position: absolute;
        bottom: calc(100% - 6px);
        right: 20px;
        width: min(420px, calc(100% - 40px));
        background: var(--surface-1);
        border: 1px solid var(--hairline);
        border-radius: 14px;
        padding: 12px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        z-index: 15;
      }
      #gif-panel.open {
        display: block;
      }
      #gif-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        max-height: 300px;
        overflow-y: auto;
        margin-top: 10px;
        min-height: 60px;
      }
      #gif-grid button {
        padding: 0;
        border-radius: 8px;
        overflow: hidden;
        aspect-ratio: 1;
        background: #121211;
        border: 1px solid var(--hairline);
      }
      #gif-grid img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #gif-grid button:focus-visible {
        outline: 2px solid var(--accent);
      }
      #gif-status {
        color: var(--text-muted);
        font-size: 12px;
        padding: 14px 0;
        text-align: center;
      }
      /* Giphy's API terms require visible attribution wherever results show. */
      .gif-foot {
        margin-top: 8px;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
        text-align: right;
      }
      .composer .row {
        align-items: flex-end;
      }
      .composer textarea {
        resize: none;
        min-height: 42px;
        max-height: 140px;
      }
      .composer .send {
        flex: 0 0 auto;
      }
      @media (max-width: 720px) {
        .composer .row {
          flex-wrap: wrap;
        }
        .composer textarea {
          font-size: 12px;
          min-width: 100%;
          max-width: 100%;
        }
        .composer .send {
          flex: 0.5;
        }
      }
      #typing {
        height: 16px;
        font-size: 11px;
        color: var(--text-muted);
        padding: 0 20px;
        background-color: #333333;
      }
      /* `textContent = ''` clears the child nodes outright rather than leaving
         an empty text node, so the strip is genuinely :empty between bursts of
         typing and can collapse instead of holding a permanent 16px gap. */
      #typing:empty {
        display: none;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: grid;
        gap: 8px;
        z-index: 20;
        max-width: 340px;
      }
      .toast div {
        background: var(--surface-1);
        border: 1px solid var(--hairline);
        border-left: 3px solid var(--accent);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
      }
      .toast div.err {
        border-left-color: var(--critical);
      }
      .toast div.warn {
        border-left-color: var(--warning);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--text-secondary);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-muted);
      }
      .dot.on {
        background: var(--good);
      }
      .dot.off {
        background: var(--critical);
      }
      .empty {
        color: var(--text-muted);
        text-align: center;
        padding: 40px 0;
      }
      .center {
        display: grid;
        place-items: center;
        flex: 1;
        color: var(--text-muted);
      }

      /* ---------- Room drawer ---------- */
      /* The arrows only mean anything once the sidebar can slide, so they stay
         hidden until the mobile breakpoint turns them on. */
      .icon-btn {
        display: none;
        flex: none;
        padding: 4px 11px;
        font-size: 18px;
        line-height: 1.2;
        color: var(--text-secondary);
      }
      .head-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .aside-head-text {
        min-width: 0;
      }

      /* Kept out of the flow with visibility rather than `display` so the fade
         has two states to animate between. */
      #scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 20;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.24s ease,
          visibility 0.24s;
      }

      @media (max-width: 720px) {
        /* Dynamic viewport units: the composer stays reachable when a mobile
           browser's toolbars slide away and `100%` would overshoot. */
        html,
        body {
          height: 100dvh;
        }

        /* One column — the sidebar leaves the grid and floats above `main`. */
        #app {
          grid-template-columns: 1fr;
        }
        aside {
          position: fixed;
          inset: 0 auto 0 0;
          width: min(290px, 82vw);
          z-index: 25;
          transform: translateX(-100%);
          transition: transform 0.24s ease;
          box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }
        #app.drawer-open aside {
          transform: translateX(0);
        }
        #app.drawer-open #scrim {
          opacity: 1;
          visibility: visible;
        }

        .icon-btn {
          display: block;
        }

        header.room-head {
          padding: 10px 14px;
        }
        #log {
          padding: 12px 14px;
        }
        .composer {
          padding: 10px 14px 12px;
        }
        #gif-panel {
          right: 14px;
          width: calc(100% - 28px);
        }

        /* iOS zooms the page in when a focused control is under 16px. */
        input,
        select,
        textarea {
          font-size: 16px;
        }
      }

      /* Touch has no hover, so the per-message actions would be unreachable. */
      @media (hover: none) {
        .msg .actions {
          display: flex;
          position: static;
          margin-top: 4px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        aside,
        #scrim {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Auth gate -->
    <section id="gate">
      <div class="card">
        <h1>Chatroom</h1>
        <p class="sub">Sign in, or register a new account.</p>
        <div class="field">
          <label for="u">Username</label>
          <input id="u" autocomplete="username" placeholder="ada" />
        </div>
        <div class="field">
          <label for="p">Password</label>
          <input id="p" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <div class="row" style="margin-top: 16px">
          <button class="primary" id="login">Sign in</button>
          <button id="register">Register</button>
        </div>
        <p class="sub" id="gate-msg" style="margin: 14px 0 0; min-height: 18px"></p>
      </div>
    </section>

    <!-- App -->
    <div id="app">
      <div id="scrim"></div>

      <aside id="drawer">
        <div class="aside-head">
          <div class="aside-head-text">
            <div class="me" id="me-name">—</div>
            <div class="role"><span class="status"><span class="dot" id="conn-dot"></span><span id="conn-text">connecting</span></span></div>
          </div>
          <button class="icon-btn" id="drawer-close" aria-label="Hide rooms">‹</button>
        </div>
        <div class="rooms" id="room-list"></div>
        <div class="aside-foot">
          <button id="new-room">+ New room</button>
          <button id="logout">Sign out</button>
        </div>
      </aside>

      <main>
        <header class="room-head">
          <div class="head-left">
            <button class="icon-btn" id="drawer-toggle" aria-label="Show rooms" aria-controls="drawer" aria-expanded="false">›</button>
            <div>
              <h2 id="room-title">Pick a room</h2>
              <div class="meta" id="room-meta"></div>
            </div>
          </div>
        </header>

        <div id="log">
          <div id="history-status" role="status" aria-live="polite"></div>
          <div class="center">Select a room from the left.</div>
        </div>
        <div id="typing"></div>

        <div class="composer">
          <div id="gif-panel" aria-label="GIF picker">
            <input id="gif-q" type="search" placeholder="Search GIFs…" autocomplete="off" />
            <div id="gif-grid"></div>
            <div id="gif-status"></div>
            <div class="gif-foot">Powered by GIPHY</div>
          </div>
          <div class="row">
            <textarea id="input" rows="1" placeholder="Message — @name to mention, Enter to send" disabled></textarea>
            <button class="send" id="gif" disabled aria-expanded="false" title="Add a GIF">GIF</button>
            <button class="primary send" id="send" disabled>Send</button>
          </div>
        </div>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
      const $ = (id) => document.getElementById(id);

      /* ------------------------------------------------------------------ */
      /* State                                                               */
      /* ------------------------------------------------------------------ */
      const state = {
        token: localStorage.getItem('chat.token'),
        me: null,
        ws: null,
        rooms: new Map(), // roomId -> room summary
        activeRoomId: null,
        messages: new Map(), // roomId -> array (oldest first)
        cursors: new Map(), // roomId -> { hasMore, nextCursor }
        loadingOlder: false, // in-flight guard for scroll-triggered paging
        unread: new Map(), // roomId -> count
        typing: new Map(), // roomId -> Map(userId -> {username, expires})
        pending: new Map(), // requestId -> {resolve, reject}
        seq: 0,
        retry: 0,
        gifEnabled: false, // false until /api/giphy/status says the server has a key
        gifSeq: 0, // discards out-of-order GIF search responses
      };

      /* ------------------------------------------------------------------ */
      /* Utilities                                                           */
      /* ------------------------------------------------------------------ */
      function toast(message, kind = '') {
        const el = document.createElement('div');
        if (kind) el.className = kind;
        el.textContent = message;
        $('toast').append(el);
        setTimeout(() => el.remove(), 5000);
      }

      const timeFmt = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' });
      const dayFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

      async function api(path, options = {}) {
        const res = await fetch(path, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
            ...(options.headers ?? {}),
          },
        });
        const payload = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(payload?.error?.message ?? `HTTP ${res.status}`);
        return payload;
      }

      /** Sends a frame and resolves with the matching ack (or rejects on error). */
      function call(type, data) {
        return new Promise((resolve, reject) => {
          if (state.ws?.readyState !== WebSocket.OPEN) {
            reject(new Error('Not connected'));
            return;
          }
          const id = `r${++state.seq}`;
          state.pending.set(id, { resolve, reject });
          state.ws.send(JSON.stringify({ id, type, ...(data ? { data } : {}) }));

          setTimeout(() => {
            if (state.pending.delete(id)) reject(new Error('Request timed out'));
          }, 10000);
        });
      }

      /* ------------------------------------------------------------------ */
      /* Rendering                                                           */
      /* ------------------------------------------------------------------ */

      /**
       * Builds the message body as DOM nodes rather than innerHTML: message
       * text is untrusted, and @mention highlighting must not become an
       * injection point.
       */
      function renderBody(text) {
        const frag = document.createDocumentFragment();
        const pattern = /(^|[^A-Za-z0-9_@.-])@([A-Za-z0-9_.-]{2,32})/g;
        let last = 0;
        let match;

        while ((match = pattern.exec(text)) !== null) {
          const start = match.index + match[1].length;
          if (start > last) frag.append(document.createTextNode(text.slice(last, start)));

          const span = document.createElement('span');
          span.className = 'mention';
          span.textContent = `@${match[2]}`;
          frag.append(span);
          last = start + match[2].length + 1;
        }
        if (last < text.length) frag.append(document.createTextNode(text.slice(last)));
        return frag;
      }

      /**
       * The server allowlists the host before storing an attachment, so the
       * url is safe as an <img src>. Width/height come from the same row and
       * reserve the space before the image decodes.
       */
      function gifNode(attachment) {
        const figure = document.createElement('div');
        figure.className = 'gif';
        if (attachment.width > 0 && attachment.height > 0) {
          figure.style.aspectRatio = `${attachment.width} / ${attachment.height}`;
          figure.style.width = `${attachment.width}px`;
        }

        const img = document.createElement('img');
        img.src = attachment.url;
        img.alt = attachment.alt || 'GIF';
        img.loading = 'lazy';
        // Scrolled-away history should not keep decoding frames.
        img.decoding = 'async';

        figure.append(img);
        return figure;
      }

      function messageNode(message) {
        const wrap = document.createElement('div');
        wrap.className = 'msg';
        wrap.dataset.id = String(message.id);

        const mentionsMe =
          state.me && message.mentions?.some((n) => n.toLowerCase() === state.me.username.toLowerCase());
        if (mentionsMe) wrap.classList.add('mentions-me');
        if (message.deletedAt) wrap.classList.add('deleted');

        const head = document.createElement('div');
        const who = document.createElement('span');
        who.className = 'who';
        who.textContent = message.username;
        const at = document.createElement('span');
        at.className = 'at';
        at.textContent = timeFmt.format(new Date(message.createdAt));
        head.append(who, at);

        if (message.editedAt && !message.deletedAt) {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = '(edited)';
          head.append(tag);
        }

        const body = document.createElement('div');
        body.className = 'body';
        if (message.deletedAt) body.textContent = 'This message was deleted.';
        else body.append(renderBody(message.body));

        wrap.append(head, body);
        // A GIF sent without a caption has an empty body; skip the blank line.
        if (!message.deletedAt && !message.body) body.remove();

        if (!message.deletedAt && message.attachment) wrap.append(gifNode(message.attachment));

        // Author-only controls; the server enforces the same rule.
        if (!message.deletedAt && state.me && message.userId === state.me.id) {
          const actions = document.createElement('div');
          actions.className = 'actions';

          const edit = document.createElement('button');
          edit.textContent = 'Edit';
          edit.onclick = () => startEdit(message);

          const del = document.createElement('button');
          del.textContent = 'Delete';
          del.onclick = async () => {
            if (!confirm('Delete this message?')) return;
            try {
              await call('message.delete', { messageId: message.id });
            } catch (err) {
              toast(err.message, 'err');
            }
          };

          actions.append(edit, del);
          wrap.append(actions);
        }
        return wrap;
      }

      // `hasMore` is tracked per room, so this always reflects the active one.
      function updateHistoryStatus() {
        const status = $('history-status');
        const roomId = state.activeRoomId;
        const cursor = state.cursors.get(roomId);
        const hasMessages = (state.messages.get(roomId) ?? []).length > 0;

        const text = state.loadingOlder
          ? 'Loading older messages…'
          : roomId && hasMessages && cursor && !cursor.hasMore
            ? 'Beginning of the conversation'
            : '';

        status.textContent = text;
        status.classList.toggle('show', text !== '');
      }

      function renderLog({ keepPosition = false } = {}) {
        const log = $('log');
        const roomId = state.activeRoomId;

        // Anchor measurements have to be taken before the DOM is swapped.
        const prevHeight = log.scrollHeight;
        const prevTop = log.scrollTop;

        // Passing the status node back in keeps it across the swap; everything
        // else in the scroller is rebuilt from state.
        log.replaceChildren($('history-status'));
        updateHistoryStatus();

        if (!roomId) {
          const empty = document.createElement('div');
          empty.className = 'center';
          empty.textContent = 'Select a room from the left.';
          log.append(empty);
          return;
        }

        const list = state.messages.get(roomId) ?? [];
        if (list.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No messages yet. Say hello.';
          log.append(empty);
          return;
        }

        let lastDay = '';
        for (const message of list) {
          const day = dayFmt.format(new Date(message.createdAt));
          if (day !== lastDay) {
            const rule = document.createElement('div');
            rule.className = 'day-rule';
            const label = document.createElement('span');
            label.textContent = day;
            rule.append(label);
            log.append(rule);
            lastDay = day;
          }
          log.append(messageNode(message));
        }

        // Prepended history must not shift text under the reader's eyes, so
        // hold the previous position by the amount the content grew.
        log.scrollTop = keepPosition ? log.scrollHeight - prevHeight + prevTop : log.scrollHeight;
      }

      function renderRooms() {
        const list = $('room-list');
        list.replaceChildren();

        const rooms = [...state.rooms.values()].sort((a, b) => a.name.localeCompare(b.name));
        for (const room of rooms) {
          const button = document.createElement('button');
          button.className = 'room-item' + (room.id === state.activeRoomId ? ' active' : '');

          const label = document.createElement('span');
          label.textContent = (room.visibility === 'private' ? '🔒 ' : '# ') + room.name;
          button.append(label);

          const unread = state.unread.get(room.id) ?? 0;
          const badge = document.createElement('span');
          if (unread > 0 && room.id !== state.activeRoomId) {
            badge.className = 'unread';
            badge.textContent = String(unread);
          } else {
            badge.className = 'badge';
            badge.textContent = room.myRole ? String(room.memberCount ?? '') : 'join';
          }
          button.append(badge);

          button.onclick = () => openRoom(room.id);
          list.append(button);
        }
      }

      function renderTyping() {
        const roomId = state.activeRoomId;
        const now = Date.now();
        const entries = [...(state.typing.get(roomId)?.values() ?? [])].filter((t) => t.expires > now);

        $('typing').textContent =
          entries.length === 0
            ? ''
            : entries.length === 1
              ? `${entries[0].username} is typing…`
              : `${entries.length} people are typing…`;
      }
      setInterval(renderTyping, 1500);

      /* ------------------------------------------------------------------ */
      /* Actions                                                             */
      /* ------------------------------------------------------------------ */
      async function openRoom(roomId) {
        try {
          const ack = await call('room.join', { roomId });
          const room = ack.room;

          state.rooms.set(room.id, {
            ...(state.rooms.get(room.id) ?? {}),
            ...room,
            myRole: ack.membership.role,
            memberCount: ack.members.length,
          });
          state.messages.set(room.id, ack.history.messages);
          state.cursors.set(room.id, {
            hasMore: ack.history.hasMore,
            nextCursor: ack.history.nextCursor,
          });
          state.activeRoomId = room.id;
          state.unread.set(room.id, 0);

          $('room-title').textContent = (room.visibility === 'private' ? '🔒 ' : '# ') + room.name;
          $('room-meta').textContent = `${ack.members.length} member(s) · ${ack.online.length} online`;
          $('input').disabled = false;
          $('send').disabled = false;
          $('gif').disabled = !state.gifEnabled;

          renderRooms();
          renderLog();
          // Picking a room is the drawer's whole purpose on a phone; leaving it
          // covering the messages afterwards would mean two taps every time.
          setDrawer(false);
        } catch (err) {
          toast(err.message, 'err');
        }
      }

      async function loadOlder() {
        const roomId = state.activeRoomId;
        const cursor = state.cursors.get(roomId);
        // The scroll handler fires continuously while the reader sits at the
        // top, so the in-flight guard is what stops a burst of duplicate pages.
        if (!cursor?.hasMore || state.loadingOlder) return;

        state.loadingOlder = true;
        updateHistoryStatus();

        try {
          const page = await call('history.fetch', { roomId, before: cursor.nextCursor, limit: 50 });

          // Rooms can be switched while a page is in flight; merging it into
          // whatever is open now would interleave two conversations.
          if (state.activeRoomId !== roomId) return;

          const existing = state.messages.get(roomId) ?? [];
          state.messages.set(roomId, [...page.messages, ...existing]);
          state.cursors.set(roomId, { hasMore: page.hasMore, nextCursor: page.nextCursor });

          state.loadingOlder = false;
          renderLog({ keepPosition: true });
        } catch (err) {
          toast(err.message, 'err');
        } finally {
          state.loadingOlder = false;
          updateHistoryStatus();
        }
      }

      function startEdit(message) {
        const next = prompt(message.attachment ? 'Edit caption' : 'Edit message', message.body);
        if (next === null || next === message.body) return;
        // An empty caption is allowed only when the GIF still carries the
        // message; the server enforces the same rule.
        if (next.trim() === '' && !message.attachment) return;

        call('message.edit', { messageId: message.id, body: next }).catch((err) =>
          toast(err.message, 'err'),
        );
      }

      /** Sends the composer text, an attachment, or both. */
      async function send(attachment = null) {
        const input = $('input');
        const body = input.value.trim();
        if ((!body && !attachment) || !state.activeRoomId) return;

        input.value = '';
        input.style.height = 'auto';

        try {
          await call('message.send', {
            roomId: state.activeRoomId,
            body,
            ...(attachment ? { attachment } : {}),
          });
        } catch (err) {
          // Put the text back so a rate-limited message is not lost.
          input.value = body;
          toast(err.message, 'err');
        }
      }

      /* ------------------------------------------------------------------ */
      /* GIF picker                                                          */
      /* ------------------------------------------------------------------ */

      /** Results come back already allowlisted by the server-side proxy. */
      function renderGifResults(gifs) {
        const grid = $('gif-grid');
        grid.replaceChildren();

        for (const gif of gifs) {
          const button = document.createElement('button');
          button.title = gif.title || 'GIF';

          const img = document.createElement('img');
          img.src = gif.previewUrl;
          img.alt = gif.title || 'GIF';
          img.loading = 'lazy';
          button.append(img);

          button.onclick = () => {
            closeGifPanel();
            // Whatever is in the composer rides along as the caption.
            send({
              kind: 'gif',
              url: gif.url,
              width: gif.width,
              height: gif.height,
              alt: gif.title ?? '',
            });
          };
          grid.append(button);
        }

        $('gif-status').textContent = gifs.length === 0 ? 'No GIFs found.' : '';
      }

      async function searchGifs(query) {
        // Discard a slow response that a newer keystroke has superseded.
        const token = ++state.gifSeq;
        $('gif-status').textContent = 'Searching…';

        try {
          const result = await api(`/api/giphy/search?q=${encodeURIComponent(query)}`);
          if (token !== state.gifSeq) return;
          renderGifResults(result.gifs ?? []);
        } catch (err) {
          if (token !== state.gifSeq) return;
          $('gif-grid').replaceChildren();
          $('gif-status').textContent = err.message;
        }
      }

      function closeGifPanel() {
        $('gif-panel').classList.remove('open');
        $('gif').setAttribute('aria-expanded', 'false');
      }

      function toggleGifPanel() {
        const panel = $('gif-panel');
        if (panel.classList.contains('open')) {
          closeGifPanel();
          return;
        }

        panel.classList.add('open');
        $('gif').setAttribute('aria-expanded', 'true');
        $('gif-q').focus();
        // Open on trending so the grid is never empty.
        searchGifs($('gif-q').value.trim());
      }

      function upsertMessage(message) {
        const list = state.messages.get(message.roomId);
        if (!list) return false;

        const index = list.findIndex((m) => m.id === message.id);
        if (index === -1) list.push(message);
        else list[index] = message;
        return true;
      }

      /* ------------------------------------------------------------------ */
      /* WebSocket                                                           */
      /* ------------------------------------------------------------------ */
      function setConnected(on, text) {
        $('conn-dot').className = 'dot ' + (on ? 'on' : 'off');
        $('conn-text').textContent = text;
      }

      function connect() {
        const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
        // Sent as a subprotocol rather than a query string so the token does
        // not end up in proxy or server access logs.
        const ws = new WebSocket(`${scheme}://${location.host}/ws`, ['bearer', state.token]);
        state.ws = ws;

        ws.onopen = () => {
          state.retry = 0;
          setConnected(true, 'connected');
        };

        ws.onclose = (event) => {
          setConnected(false, 'disconnected');
          $('input').disabled = true;
          $('send').disabled = true;
          $('gif').disabled = true;
          closeGifPanel();

          // 4001 unauthorized / 4003 banned are terminal: the stored token
          // will never work again, so stop reconnecting and clear it.
          if (event.code === 4001 || event.code === 4003) {
            toast(event.reason || 'Session ended', 'err');
            signOut();
            return;
          }

          // Exponential backoff, capped, so a server restart does not turn
          // into a reconnect storm.
          const delay = Math.min(1000 * 2 ** state.retry++, 15000);
          setConnected(false, `reconnecting in ${Math.round(delay / 1000)}s`);
          setTimeout(connect, delay);
        };

        ws.onmessage = (event) => {
          let frame;
          try {
            frame = JSON.parse(event.data);
          } catch {
            return;
          }
          handleFrame(frame);
        };
      }

      function handleFrame(frame) {
        // Resolve a pending request first, whatever the frame type.
        if (frame.id && state.pending.has(frame.id)) {
          const { resolve, reject } = state.pending.get(frame.id);
          state.pending.delete(frame.id);
          if (frame.type === 'error') reject(new Error(frame.message));
          else resolve(frame.data ?? {});
          return;
        }

        switch (frame.type) {
          case 'ready': {
            state.me = frame.data.user;
            $('me-name').textContent = frame.data.user.username;
            for (const room of frame.data.rooms) state.rooms.set(room.id, room);
            renderRooms();

            // Land somewhere useful on first connect.
            if (!state.activeRoomId) {
              const first = [...state.rooms.values()].find((r) => r.myRole) ?? [...state.rooms.values()][0];
              if (first) openRoom(first.id);
            }
            break;
          }

          case 'message.new': {
            const message = frame.data.message;
            // upsert returns false for a room whose history is not loaded
            // yet; the unread badge must still count it.
            upsertMessage(message);

            if (message.roomId === state.activeRoomId) renderLog();
            else {
              state.unread.set(message.roomId, (state.unread.get(message.roomId) ?? 0) + 1);
              renderRooms();
            }
            break;
          }

          case 'message.edited': {
            if (upsertMessage(frame.data.message) && frame.data.message.roomId === state.activeRoomId) {
              renderLog();
            }
            break;
          }

          case 'message.deleted': {
            const list = state.messages.get(frame.data.roomId);
            const target = list?.find((m) => m.id === frame.data.messageId);
            if (target) {
              target.deletedAt = frame.data.deletedAt;
              target.body = '';
              // Mirrors the server, which withholds both on read.
              target.attachment = null;
              if (frame.data.roomId === state.activeRoomId) renderLog();
            }
            break;
          }

          case 'mention': {
            const message = frame.data.message;
            if (message.userId !== state.me?.id) {
              const preview = message.body
                ? message.body.slice(0, 80)
                : message.attachment
                  ? '[GIF]'
                  : '';
              toast(`@${message.username} mentioned you: ${preview}`, 'warn');
            }
            break;
          }

          case 'typing': {
            if (!state.typing.has(frame.data.roomId)) state.typing.set(frame.data.roomId, new Map());
            const room = state.typing.get(frame.data.roomId);

            if (frame.data.isTyping) {
              room.set(frame.data.userId, { username: frame.data.username, expires: Date.now() + 4000 });
            } else {
              room.delete(frame.data.userId);
            }
            renderTyping();
            break;
          }

          case 'room.presence': {
            if (frame.data.roomId === state.activeRoomId) {
              toast(`${frame.data.username} ${frame.data.event} the room`);
            }
            break;
          }

          case 'room.created': {
            state.rooms.set(frame.data.room.id, { ...frame.data.room, memberCount: 1, myRole: null });
            renderRooms();
            break;
          }

          case 'system': {
            toast(frame.data.message, 'warn');
            if (frame.data.event === 'room_deleted' || frame.data.event === 'room_archived') {
              state.rooms.delete(frame.data.roomId);
              if (state.activeRoomId === frame.data.roomId) {
                state.activeRoomId = null;
                renderLog();
              }
              renderRooms();
            }
            break;
          }

          case 'error':
            toast(frame.message, 'err');
            break;
        }
      }

      /* ------------------------------------------------------------------ */
      /* Auth + wiring                                                       */
      /* ------------------------------------------------------------------ */
      /**
       * GIFs are optional: the server only enables them when it has a Giphy
       * API key. Hide the button outright rather than offering a control that
       * always errors.
       */
      async function probeGifSupport() {
        try {
          const { enabled } = await api('/api/giphy/status');
          state.gifEnabled = enabled === true;
        } catch {
          state.gifEnabled = false;
        }
        $('gif').style.display = state.gifEnabled ? '' : 'none';
        if (state.gifEnabled && state.activeRoomId) $('gif').disabled = false;
      }

      function enterApp() {
        $('gate').style.display = 'none';
        $('app').classList.add('live');
        connect();
        probeGifSupport();
      }

      function signOut() {
        localStorage.removeItem('chat.token');
        location.reload();
      }

      async function authenticate(path) {
        const username = $('u').value.trim();
        const password = $('p').value;
        $('gate-msg').textContent = '';

        try {
          const result = await api(`/api/auth/${path}`, {
            method: 'POST',
            body: JSON.stringify({ username, password }),
          });
          state.token = result.token;
          localStorage.setItem('chat.token', result.token);
          enterApp();
        } catch (err) {
          $('gate-msg').textContent = err.message;
        }
      }

      $('login').onclick = () => authenticate('login');
      $('register').onclick = () => authenticate('register');
      $('p').onkeydown = (e) => {
        if (e.key === 'Enter') authenticate('login');
      };

      $('logout').onclick = signOut;
      $('send').onclick = () => send();

      // Automatic paging, in place of the old "Load older" button: nearing the
      // top of the scroller pulls the next page. The trigger sits above the
      // very top so the history is already arriving by the time you get there.
      const HISTORY_TRIGGER_PX = 120;
      $('log').addEventListener('scroll', () => {
        if ($('log').scrollTop <= HISTORY_TRIGGER_PX) loadOlder();
      });

      $('gif').onclick = toggleGifPanel;

      // One search per 300ms of quiet, not one per keystroke — each is an
      // upstream API call against a per-user budget.
      let gifDebounce;
      $('gif-q').oninput = (e) => {
        clearTimeout(gifDebounce);
        const query = e.target.value.trim();
        gifDebounce = setTimeout(() => searchGifs(query), 300);
      };

      $('gif-q').onkeydown = (e) => {
        if (e.key === 'Escape') {
          closeGifPanel();
          $('input').focus();
        }
      };

      // Click-away closes the panel, but not a click inside it.
      document.addEventListener('click', (e) => {
        if (!$('gif-panel').classList.contains('open')) return;
        if (e.target.closest('#gif-panel') || e.target.closest('#gif')) return;
        closeGifPanel();
      });

      /* ------------------------------------------------------------------ */
      /* Room drawer (mobile)                                                */
      /* ------------------------------------------------------------------ */
      // Above the breakpoint the sidebar is pinned by the grid and none of
      // this runs — `drawer-open` only has styling attached inside the query.
      const wideScreen = window.matchMedia('(min-width: 721px)');

      function setDrawer(open) {
        $('app').classList.toggle('drawer-open', open);
        $('drawer-toggle').setAttribute('aria-expanded', String(open));
      }

      $('drawer-toggle').onclick = () => setDrawer(!$('app').classList.contains('drawer-open'));
      $('drawer-close').onclick = () => setDrawer(false);
      $('scrim').onclick = () => setDrawer(false);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') setDrawer(false);
      });

      // Rotating to landscape mid-slide would otherwise strand the class, and
      // with it a scrim the desktop layout has no way to dismiss.
      wideScreen.addEventListener('change', (e) => {
        if (e.matches) setDrawer(false);
      });

      $('new-room').onclick = async () => {
        const name = prompt('Room name');
        if (!name) return;
        const visibility = confirm('Make this room private? (OK = private)') ? 'private' : 'public';

        try {
          const ack = await call('room.create', { name, visibility });
          state.rooms.set(ack.room.id, { ...ack.room, memberCount: 1, myRole: 'owner' });
          renderRooms();
          openRoom(ack.room.id);
        } catch (err) {
          toast(err.message, 'err');
        }
      };

      // Enter sends; Shift+Enter inserts a newline.
      let typingSentAt = 0;
      $('input').onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
          return;
        }
        // Throttle: one typing frame per 2s, not one per keystroke.
        const now = Date.now();
        if (state.activeRoomId && now - typingSentAt > 2000) {
          typingSentAt = now;
          call('typing', { roomId: state.activeRoomId, isTyping: true }).catch(() => {});
        }
      };
      $('input').oninput = (e) => {
        e.target.style.height = 'auto';
        e.target.style.height = `${Math.min(e.target.scrollHeight, 140)}px`;
      };

      if (state.token) enterApp();
    </script>
  </body>
</html>
